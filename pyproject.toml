[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-runbook"
version = "0.1.0"
description = "Declarative runbook framework for AI agent skills"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0", "jinja2>=3.0"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
]
authors = [{name = "KnoxOps"}]

[project.urls]
Homepage = "https://github.com/KnoxOps/agent-runbook"
Repository = "https://github.com/KnoxOps/agent-runbook"
Issues = "https://github.com/KnoxOps/agent-runbook/issues"

[project.scripts]
gen-skill = "agent_runbook.cli:main"

[tool.setuptools.packages.find]
include = ["agent_runbook*"]
